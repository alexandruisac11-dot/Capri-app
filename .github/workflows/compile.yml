name: Build Capri

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip source
        run: |
          if [ -f capri.zip ]; then
            unzip -q capri.zip
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        run: |
          # Automatically find gradlew anywhere in the repository
          GRADLEW_FILE=$(find . -name gradlew | head -n 1)
          if [ -z "$GRADLEW_FILE" ]; then
            echo "Error: gradlew not found anywhere!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW_FILE")
          echo "Found project directory at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: capri-apk
          path: '**/build/outputs/apk/debug/app-debug.apk'
